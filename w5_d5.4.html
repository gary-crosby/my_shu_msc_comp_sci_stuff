<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solar System Explorer</title>
  </head>

  <body>

    <script src="w5_d5.4.js" defer></script>

    <div id="planet-info">
      <h1>Welcome to Solar System Explorer</h1>
      <p>
        This application allows you to learn about the amazing planets in our solar system.
      </p>
    </div>

    <div id="planet-list">
      <!-- Dynamically add planet checkboxes to the DOM from JSON data -->
      <p>Select at least one planet</p>
    </div>

    <div id="planet-details">
      <p>Select at least one characteristic:</p>
      <label>
        <input type="checkbox" name="details" value="type" />
        Type
      </label>
      <label>
        <input type="checkbox" name="details" value="mass" />
        Mass (Earth masses)
      </label>
      <label>
        <input type="checkbox" name="details" value="orbit_yr" />
        Orbit (years)
      </label>
      <label>
        <input type="checkbox" name="details" value="orbit_au" />
        Orbit (AU)
      </label>
      <label>
        <input type="checkbox" name="details" value="moons" />
        Moons
      </label>
    </div>

    <div id="selected-details">
      <!-- Dynamically display user selected details here -->
      <p>The data you selected:</p>
      <textarea id="data-output" rows="10" cols="80" readonly>Please select at least one planet and one characteristic to see the data.</textarea>
    </div>

    <div id="clear">
      <input
        type="button"
        value="Clear Selections"
        onclick="clearSelections()"
      />
    </div>

  </body>

</html>
